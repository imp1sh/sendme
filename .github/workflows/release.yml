name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (without leading v)"
        required: true

env:
  TARGET: x86_64-unknown-linux-gnu
  IROH_FORCE_STAGING_RELAYS: "1"

jobs:
  # ── Build release binaries ──────────────────────────────────────────────
  build-binaries:
    name: build-binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: swatinem/rust-cache@v2
        with:
          key: release-${{ env.TARGET }}

      # GUI libs needed to compile sendme-balloon (eframe/egui/winit)
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            echo "version=${{ github.event.inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CLI release binary
        run: cargo build --release --target ${{ env.TARGET }} --bin sendme

      - name: Build balloon release binary
        run: cargo build --release --features balloon --target ${{ env.TARGET }} --bin sendme-balloon

      - name: Create release archives
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          # CLI
          tar czf "dist/sendme-v${VERSION}-linux-amd64.tar.gz" \
              -C "target/${{ env.TARGET }}/release" sendme
          # Balloon GUI
          tar czf "dist/sendme-balloon-v${VERSION}-linux-amd64.tar.gz" \
              -C "target/${{ env.TARGET }}/release" sendme-balloon
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/

  # ── Build and push container image ──────────────────────────────────────
  build-container:
    name: build-container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            echo "version=${{ github.event.inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/imp1sh/sendme-balloon:latest
            ghcr.io/imp1sh/sendme-balloon:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=sendme-balloon
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/imp1sh/sendme-balloon
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Create GitHub release with binary downloads ──────────────────────────
  create-release:
    name: create-release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-binaries.outputs.version }}
          name: v${{ needs.build-binaries.outputs.version }}
          generate_release_notes: true
          files: dist/*.tar.gz
